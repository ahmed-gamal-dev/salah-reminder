name: Windows Store screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: microsoft-store-x64
          run-id: 39992023411
          github-token: ${{ github.token }}
          path: store-package
      - name: Unpack the verified Store application
        shell: pwsh
        run: |
          $package = (Get-ChildItem store-package -Filter '*.appx').FullName
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $makeappx = Get-ChildItem "$kits/*/x64/makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw 'Windows SDK missing' }
          & $makeappx.FullName unpack /p $package /d (Join-Path $PWD 'store-app') /o
          if ($LASTEXITCODE -ne 0) { throw 'Package extraction failed' }
      - name: Capture real Windows application windows
        shell: pwsh
        run: node scripts/capture-store-artwork.mjs "${{ github.workspace }}/store-app/app/Salah Reminder.exe" "${{ github.workspace }}/store-screenshots"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-store-screenshots
          if-no-files-found: error
          path: store-screenshots/*.png
